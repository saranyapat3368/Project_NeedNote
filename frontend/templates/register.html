<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน | NEED NOTE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylee.css') }}">
</head>
<body class="register-page">
    <div class="header-banner">
        <div class="header-content">
            <div class="logo-text">
                <span class="logo-siet">SIET</span> | <span class="logo-kmitl">KMITL</span>
            </div>
            <div class="user-icon">👤</div>
        </div>
        <div class="title-bar">
            <h1>NEED NOTE</h1>
        </div>
    </div>
 
      <div class="register-box">
            <h2 class="form-title-register">ลงทะเบียน</h2>
            <form method="POST" action="/register">
                <div class="input-group">
                    <label for="fullname">ชื่อ-สกุล</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="input-group">
                    <label for="student_id">รหัสนักศึกษา</label>
                    <input type="text" id="student_id" name="student_id" required>
                </div>
                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-button">ลงทะเบียน</button>
            </form>
            <div class="forgot-register-links">
                <a href="/login" class="forgot-link">เข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
</body>
</html>
