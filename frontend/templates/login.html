<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | NEED NOTE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylee.css') }}">
</head>
<body class="login-page">
    <div class="header-banner">
        <div class="header-content">
            <div class="logo-text">
                <span class="logo-siet">SIET</span> | <span class="logo-kmitl">KMITL</span>
            </div>
            <div class="user-icon">👤</div>
        </div>
        <div class="title-bar">
            <h1>NEED NOTE</h1>
        </div>
    </div>

    <div class="main-container">
        <div class="login-box">
            <h2 class="form-title">กรุณาล็อกอินเพื่อเข้าสู่ระบบ</h2>
            <form method="POST" action="/login">
                <div class="input-group">
                    <label for="student_id">username/studentID</label>
                    <input type="text" id="student_id" name="student_id" required>
                </div>
                <div class="input-group">
                    <label for="password">password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-button">เข้าสู่ระบบ</button>
            </form>
            <div class="forgot-register-links">
                <a href="#" class="forgot-link">ลืมรหัสผ่าน?</a>
                <a href="/register" class="register-btn-inline">ลงทะเบียน</a>
            </div>
        </div>
        
        <a href="/register" class="register-btn-floating">ลงทะเบียนสำหรับผู้ใช้ใหม่</a>
    </div>

</body>
</html>
