<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สร้างโน้ต</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="left-icons">
            <button class="icon-btn">☰</button>
            <button class="icon-btn">🔖</button>
        </div>
        <div class="logo">
            <img src="{{ url_for('static', filename='img/siet_logo.png') }}">
            <img src="{{ url_for('static', filename='img/kmitl_logo.png') }}">
        </div>
        <div class="right-profile">
            <input type="text" placeholder="ค้นหา..." class="search-box">
            <img src="{{ url_for('static', filename='img/profile_icon.png') }}" class="profile-icon">
        </div>
    </header>

    <main class="create-note-container">
        <h2>อัปโหลดโน้ต</h2>

        <form method="POST" enctype="multipart/form-data" class="note-form">
            <div class="upload-box">
                <label for="note_file">+</label>
                <input type="file" id="note_file" name="note_file" accept=".pdf,.png" required>
            </div>

            <div class="note-info">
                <label>อีเมล:</label>
                <input type="email" value="example@student.com" readonly>

                <label>วิชา:</label>
                <input type="text" name="subject" placeholder="ระบุชื่อวิชา" required>

                <label>สาขา:</label>
                <select name="branch" required>
                    <option value="">-- เลือกสาขา --</option>
                    <option value="CS">เทคโนโลยีคอมพิวเตอร์</option>
                    <option value="ET">อิเล็กทรอนิกส์โทรคมนาคม</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn green">ยืนยัน</button>
                <a href="/dashboard" class="btn red">ยกเลิก</a>
            </div>
        </form>
    </main>

</body>
</html>
