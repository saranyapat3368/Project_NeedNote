<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>ลืมรหัสผ่าน</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
</head>
<body>

    <header class="header-pink">
        <img src="{{ url_for('static', filename='img/siet_logo.png') }}" alt="SIET Logo" class="logo-left" />
        <img src="{{ url_for('static', filename='img/kmitl_logo.png') }}" alt="KMITL Logo" class="logo-center" />
        <img src="{{ url_for('static', filename='img/profile_icon.png') }}" alt="Profile Icon" class="logo-right" />
    </header>

    <section class="title-bar-purple">
        <h1><em>NEED NOTE</em></h1>
    </section>

    <main class="forgot-container">
        <div class="forgot-box">
            <form method="POST" action="/forgot_password">
                <label>กรุณากรอกอีเมลและรหัสผ่านใหม่</label>
                <input type="email" name="email" placeholder="อีเมลที่ลงทะเบียน" required />
                <input type="password" name="new_password" placeholder="รหัสผ่านใหม่" required />
                <button type="submit" class="btn-green">ยืนยัน</button>
            </form>
            <div class="forgot-footer">
                <a href="/login">กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </main>

</body>
</html>
