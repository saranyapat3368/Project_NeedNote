<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    {% if session['user'] %}
    <header>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="nav-button">Dashboard</a>
            <a href="#" class="nav-button">Users Management</a>
            <a href="#" class="nav-button">Settings</a>
            <a href="{{ url_for('logout') }}" class="nav-button">Logout</a>
        </nav>
    </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
    
</body>
</html>
