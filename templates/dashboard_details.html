{% extends "layout.html" %}
{% block title %}Dashboard Details - {{ metric_name }}{% endblock %}
{% block content %}
<div class="content-header">
    <h1>Details: {{ metric_name }}</h1>
</div>
<div class="card large chart-container">
    <h3>{{ metric_name }} in Last 7 Days</h3>
    <canvas id="detailChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        let apiUrl = '';
        let chartLabel = '';
        let chartType = 'line';
        
        if ("{{ metric_name }}" === "Total Views") {
            apiUrl = '/api/views-chart-data';
            chartLabel = '# of Views';
            chartType = 'line';
        } 
        else if ("{{ metric_name }}" === "Logins Today") {
            apiUrl = '/api/logins-chart-data';
            chartLabel = '# of Logins';
            chartType = 'bar';
        }
        else if ("{{ metric_name }}" === "Total Notes") {
            apiUrl = '/api/notes-chart-data';
            chartLabel = '# of New Notes';
            chartType = 'line';
        }
        else if ("{{ metric_name }}" === "Total Users") {
            document.querySelector('.chart-container').innerHTML = '<p>ยังไม่มีกราฟสำหรับ Total Users</p>';
        }

        if (apiUrl) {
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('detailChart');
                    new Chart(ctx, {
                        type: chartType,
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: chartLabel,
                                data: data.data,
                                backgroundColor: 'rgba(255, 174, 240, 0.2)',
                                borderColor: 'rgba(255, 174, 240, 1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }}},
                            responsive: true, maintainAspectRatio: false
                        }
                    });
                });
        }
    });
</script>
{% endblock %}
