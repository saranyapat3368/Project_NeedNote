{% extends "layout.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="content-header">
    <h1>Dashboard</h1>
</div>
<div class="dashboard-grid">
    <a href="{{ url_for('dashboard_details', metric='total_notes') }}" class="dashboard-card">
        <h2>{{ stats.total_notes }}</h2>
        <p>Total Notes</p>
    </a>
    <a href="{{ url_for('dashboard_details', metric='total_views') }}" class="dashboard-card">
        <h2>{{ stats.total_views }}</h2>
        <p>Total Views</p>
    </a>
    <a href="{{ url_for('dashboard_details', metric='total_users') }}" class="dashboard-card">
        <h2>{{ stats.total_users }}</h2>
        <p>Total Users</p>
    </a>
    <a href="{{ url_for('dashboard_details', metric='logins_today') }}" class="dashboard-card">
        <h2>{{ stats.logins_today }}</h2>
        <p>Logins Today</p>
    </a>

    <div class="card large chart-container">
        <h3>Logins in Last 7 Days</h3>
        <canvas id="myChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // แก้ไข URL ของ fetch ตรงนี้ให้ถูกต้อง
        fetch('/api/logins-chart-data')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('myChart');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: '# of Logins', data: data.data,
                            backgroundColor: 'rgba(195, 161, 255, 0.6)',
                            borderColor: 'rgba(195, 161, 255, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }}},
                        responsive: true, maintainAspectRatio: false
                    }
                });
            });
    });
</script>
{% endblock %}
